<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="users.pageTitle">HMS - User Management</title>

  <!-- Bootstrap CSS -->
  <link id="bootstrap-css" href="../css/bootstrap/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
  <!-- RTL CSS -->
  <link class="rtl-css" href="../css/dashboard-rtl.css" rel="stylesheet" disabled>
  <link class="rtl-css" href="../css/admin-rtl.css" rel="stylesheet" disabled>
  <link id="bootstrap-rtl-css" href="../css/bootstrap/bootstrap.rtl.min.css" rel="stylesheet" disabled>
  <!-- SweetAlert2 CSS -->
  <link href="../css/sweetalert2/sweetalert2.css" rel="stylesheet">
</head>

<body>
  <div class="wrapper">
    <!-- Sidebar (same as dashboard) -->
    <nav id="sidebar" class="active">
      <div class="sidebar-header">
        <h3>HMS</h3>
        <h3 class="sidebar-mini">H</h3>
      </div>

      <div class="sidebar-profile">
        <div class="profile-image d-flex justify-content-center">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="userFullName">Loading...</div>
          <div class="profile-role" id="userRole">Loading...</div>
        </div>
      </div>

      <ul class="list-unstyled components" id="sidebarComponents"></ul>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-link">
          <i class="bi bi-box-arrow-left"></i>
          <span data-i18n="sidebar.logout">Logout</span>
        </button>
      </div>
    </nav>

    <!-- Page Content -->
    <div id="content">
      <!-- Top Navigation -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-light">
            <i class="bi bi-list"></i>
          </button>
          <div class="page-title">
            <h4 data-i18n="users.title">User Management</h4>
          </div>
          <!-- Language Switcher -->
          <div class="ms-auto">
            <div class="dropdown">
              <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-globe"></i>
                <span id="currentLanguage">EN</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                <li><a class="dropdown-item language-option" href="#" data-lang="en">
                    <i class="bi bi-check2 language-check" style="display: none;"></i>
                    English
                  </a></li>
                <li><a class="dropdown-item language-option" href="#" data-lang="ar">
                    <i class="bi bi-check2 language-check" style="display: none;"></i>
                    العربية
                  </a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="container-fluid">
        <!-- Action Buttons -->
        <div class="row mb-4">
          <div class="col">
            <button type="button" class="btn btn-primary" id="createUserBtn">
              <i class="bi bi-person-plus"></i> <span data-i18n="users.createNewUser">Create New User</span>
            </button>
          </div>
        </div>

        <!-- Search and Filter -->
        <div class="card mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-search"></i>
                  </span>
                  <input type="text" class="form-control" id="searchUser" data-i18n-placeholder="users.searchPlaceholder" placeholder="Search users...">
                </div>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="roleFilter">
                  <option value="" data-i18n="users.filters.allRoles">All Roles</option>
                  <!-- Roles will be dynamically loaded -->
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                  <option value="" data-i18n="users.filters.allStatus">All Status</option>
                  <option value="active" data-i18n="common.active">Active</option>
                  <option value="inactive" data-i18n="common.inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th data-i18n="users.table.username">Username</th>
                    <th data-i18n="users.table.role">Role</th>
                    <th data-i18n="users.table.createdDate">Created Date</th>
                    <th data-i18n="common.actions">Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <!-- Users will be dynamically loaded -->
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <nav aria-label="Users pagination" class="mt-4">
              <ul class="pagination justify-content-center" id="usersPagination">
                <!-- Pagination will be dynamically generated -->
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalLabel" data-i18n="users.createNewUser">Create New User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-aria="common.close" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="userForm" novalidate>
            <input type="hidden" id="userId">
            <div class="mb-3">
              <label for="username" class="form-label" data-i18n="users.fields.username">Username</label>
              <input type="text" class="form-control" id="username" required minlength="3" maxlength="50">
              <div class="invalid-feedback" data-i18n="users.validation.usernameLength">
                Username must be between 3 and 50 characters
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label" data-i18n="users.fields.password">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" required minlength="8">
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
              <div class="invalid-feedback" data-i18n="users.validation.passwordLength">
                Password must be at least 8 characters long
              </div>
            </div>
            <div class="mb-3">
              <label for="roleSelect" class="form-label" data-i18n="users.fields.role">Role</label>
              <select class="form-select" id="roleSelect" required>
                <option value="" data-i18n="users.selectRole">Select a role</option>
                <!-- Roles will be dynamically loaded -->
              </select>
              <div class="invalid-feedback" data-i18n="users.validation.roleRequired">
                Please select a role
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveUserBtn">
            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            <span class="btn-text" data-i18n="common.save">Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper-->
  <script src="../js/bootstrap/dist/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="../js/sweetalert2/src/sweetalert2.js" type="module"></script>
  <!-- i18n Utility -->
  <script src="../js/utils/i18n.js" type="module"></script>
  <!-- Custom JS -->
  <script src="../js/shared/sidebar.js" type="module"></script>
  <script src="../js/admin/users.js" type="module"></script>
</body>

</html>
