<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS - Role Management</title>

  <!-- Bootstrap CSS -->
  <link href="../css/bootstrap/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link href="../css/sweetalert2/sweetalert2.css" rel="stylesheet">
</head>

<body>
  <div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar" class="active">
      <div class="sidebar-header">
        <h3>HMS</h3>
        <h3 class="sidebar-mini">H</h3>
      </div>

      <div class="sidebar-profile">
        <div class="profile-image d-flex justify-content-center">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="userFullName">Loading...</div>
          <div class="profile-role" id="userRole">Loading...</div>
        </div>
      </div>

      <ul class="list-unstyled components" id="sidebarComponents"></ul>


      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-link">
          <i class="bi bi-box-arrow-left"></i>
          <span>Logout</span>
        </button>
      </div>
    </nav>

    <!-- Page Content -->
    <div id="content">
      <!-- Top Navigation -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <button type="button" id="sidebarCollapse" class="btn btn-light">
            <i class="bi bi-list"></i>
          </button>
          <div class="page-title">
            <h4>Role Management</h4>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="container-fluid">
        <!-- Action Buttons -->
        <div class="row mb-4">
          <div class="col">
            <button type="button" class="btn btn-primary" id="createRoleBtn">
              <i class="bi bi-shield-plus"></i> Create New Role
            </button>
          </div>
        </div>

        <!-- Roles List -->
        <div class="row" id="rolesContainer">
          <!-- Roles will be dynamically added here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Role Modal -->
  <div class="modal fade" id="roleModal" tabindex="-1" aria-labelledby="roleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="roleModalLabel">Create New Role</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="roleForm" novalidate>
            <input type="hidden" id="roleId">
            <div class="mb-4">
              <label for="roleName" class="form-label">Role Name</label>
              <input type="text" class="form-control" id="roleName" required minlength="3" maxlength="50">
              <div class="invalid-feedback">
                Role name must be between 3 and 50 characters
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Permissions</label>
              <div class="alert alert-info">
                <i class="bi bi-info-circle"></i>
                Select the permissions for this role. Users assigned this role will have access to these features.
              </div>
              <div class="permissions-container border rounded p-3" style="max-height: 300px; overflow-y: auto;">
                <div id="permissionsGrid" class="row g-3">
                  <!-- Permissions will be dynamically added here -->
                </div>
              </div>
              <div class="mt-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="selectAllPermissions">
                  Select All
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="deselectAllPermissions">
                  Deselect All
                </button>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveRoleBtn">
            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            <span class="btn-text">Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="../js/bootstrap/dist/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="../js/sweetalert2/src/sweetalert2.js" type="module"></script>
  <!-- Custom JS -->
  <script src="../js/shared/sidebar.js" type="module"></script>
  <script src="../js/admin/roles.js" type="module"></script>
</body>

</html>
